name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.event.pull_request.merge_commit_sha }}

      - name: Determine release version
        id: version
        run: |
          set -euo pipefail
          app_version="$(
            xcodebuild \
              -project Timbre.xcodeproj \
              -scheme Timbre \
              -configuration Release \
              -showBuildSettings |
              awk '/MARKETING_VERSION/ { print $3; exit }'
          )"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=v$app_version" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip already published version
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches the app version
        if: steps.existing_release.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            exit 0
          fi
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" != "$APP_VERSION" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match MARKETING_VERSION $APP_VERSION"
            exit 1
          fi

      - name: Build release app
        if: steps.existing_release.outputs.skip != 'true'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Timbre.xcodeproj \
            -scheme Timbre \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release/Timbre.app"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Package release
        if: steps.existing_release.outputs.skip != 'true'
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release/Timbre.app"
          dmg_root="$RUNNER_TEMP/dmg-root"
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$dmg_root" "$release_dir"
          ditto "$app_path" "$dmg_root/Timbre.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname "Timbre" \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "$release_dir/Timbre.dmg"
          cd "$release_dir"
          shasum -a 256 Timbre.dmg > Timbre.dmg.sha256

      - name: Publish GitHub Release
        if: steps.existing_release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          release_args=(
            "$RELEASE_TAG"
            "$RUNNER_TEMP/release/Timbre.dmg"
            "$RUNNER_TEMP/release/Timbre.dmg.sha256"
            --generate-notes
            --title "Timbre $RELEASE_TAG"
          )
          if [[ "${{ github.event_name }}" == "push" ]]; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$MERGE_COMMIT_SHA")
          fi
          gh release create "${release_args[@]}"
